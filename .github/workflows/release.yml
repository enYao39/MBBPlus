name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.7)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release after build'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore.tmp

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            # Extract versionName from build.gradle.kts
            VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DST="MoreBubbleButton-v${VERSION}.apk"
          cp "$APK_SRC" "$APK_DST"
          echo "apk_path=$APK_DST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoreBubbleButton-v${{ steps.rename.outputs.version }}
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore.tmp

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rename.outputs.version }}
          name: v${{ steps.rename.outputs.version }}
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
