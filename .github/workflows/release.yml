name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.7), leave empty to read from build.gradle.kts'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release after build'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and platform
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore.tmp

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleDebug assembleRelease

      - name: Rename APKs
        id: apks
        run: |
          V="${{ steps.version.outputs.name }}"
          RELEASE_SRC="app/build/outputs/apk/release/app-release.apk"
          DEBUG_SRC="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DST="MoreBubbleButton-v${V}-release.apk"
          DEBUG_DST="MoreBubbleButton-v${V}-debug.apk"
          cp "$RELEASE_SRC" "$RELEASE_DST"
          cp "$DEBUG_SRC"   "$DEBUG_DST"
          echo "release=$RELEASE_DST" >> "$GITHUB_OUTPUT"
          echo "debug=$DEBUG_DST"     >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoreBubbleButton-v${{ steps.version.outputs.name }}-release
          path: ${{ steps.apks.outputs.release }}
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoreBubbleButton-v${{ steps.version.outputs.name }}-debug
          path: ${{ steps.apks.outputs.debug }}
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore.tmp

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          files: |
            ${{ steps.apks.outputs.release }}
            ${{ steps.apks.outputs.debug }}
          generate_release_notes: true
